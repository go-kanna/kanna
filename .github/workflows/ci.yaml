name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: golangci-lint (orm/integration)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: orm/integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start databases
        run: docker compose -f orm/integration/compose.yaml up -d --wait

      - name: Run integration tests
        run: make test-integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run build
        run: make build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate examples
        run: make examples

      - name: Check the examples are up to date
        run: |
          if [ -n "$(git status --porcelain -- examples)" ]; then
            echo "::error::example output is stale; run 'make examples' and commit the result"
            git status --porcelain -- examples
            git diff -- examples
            exit 1
          fi
