name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        # go install verifies the pinned version against the module checksum
        # database, so no mutable installer script runs in CI.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Start databases
        run: docker compose -f orm/integration/compose.yaml up -d --wait

      - name: Run integration tests
        run: make test-integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: orm/integration/coverage.out
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run build
        run: make build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Start databases
        # The orm example runs against real databases when they are up, and
        # prints a hint and exits cleanly when they are not. Starting them
        # here makes CI exercise the full path.
        run: docker compose -f orm/integration/compose.yaml up -d --wait

      - name: Regenerate examples
        run: make examples

      - name: Check the examples are up to date
        run: |
          if [ -n "$(git status --porcelain -- examples)" ]; then
            echo "::error::example output is stale; run 'make examples' and commit the result"
            git status --porcelain -- examples
            git diff -- examples
            exit 1
          fi
